events {}

http {
    # Réplicas do Transit Service: o cliente nunca as enxerga (transparência de localização).
    upstream transit_upstream {
        least_conn;
        server transit-1:8080 max_fails=2 fail_timeout=10s;
        server transit-2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8080;

        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/transit/ {
            proxy_pass http://transit_upstream;
            # Tenta a outra réplica em falhas de conexão/timeout (POST não é reenviado por padrão).
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /api/appointments {
            proxy_pass http://appointments:8080;
        }

        location = /health {
            default_type text/plain;
            return 200 "gateway ok\n";
        }
    }
}
