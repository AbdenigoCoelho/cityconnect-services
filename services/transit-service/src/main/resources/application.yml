spring:
  application:
    name: transit-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:cityconnect}
    password: ${RABBITMQ_PASSWORD:cityconnect-dev}   # apenas desenvolvimento

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

instance:
  name: ${INSTANCE_NAME:${HOSTNAME:local}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
